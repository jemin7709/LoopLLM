[project]
name = "loopllm"
version = "0.1.0"
description = "LoopLLM minimal uv env"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "accelerate==1.4.0",
    "compressed-tensors==0.15.0.1",
    "datasets==2.16.1",
    "flash-attn>=2.8.3",
    "matplotlib>=3.10.9",
    "numpy==2.2.3",
    "omegaconf>=2.3.0",
    "pandas==2.2.3",
    "seaborn>=0.13.2",
    "sentence-transformers>=5.4.1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "transformers==5.5.1",
    "vllm==0.19.1",
]

[tool.uv]
package = false
no-build-isolation-package = ["flash-attn"]
